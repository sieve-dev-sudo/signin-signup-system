<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in to Website</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container" id="container">

  <div class="form-container sign-up-container">
    <form id="signUpForm" novalidate>
      <h1>Create account</h1>

      <div class="social-container mobile-social">
        <a href="#" aria-label="Facebook">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.51 1.49-3.9 3.77-3.9 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.91h-2.34V22c4.78-.79 8.44-4.94 8.44-9.94z"/></svg>
        </a>
        <a href="#" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.86 0-2.15 1.45-2.15 2.94v5.67H9.34V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>
        </a>
        <a href="#" aria-label="X">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M18.9 2H22l-7.6 8.7L23.3 22h-7.2l-5.6-7.3L4 22H1l8.1-9.3L1 2h7.4l5.1 6.7L18.9 2zm-1.3 18h1.9L7 4h-2l12.6 16z"/></svg>
        </a>
      </div>

      <label for="suName" class="sr-only">Name</label>
      <input type="text" id="suName" name="name" placeholder="Name" aria-label="Name" required>
      <span class="error-message" id="suNameError"></span>

      <label for="suEmail" class="sr-only">Email</label>
      <input type="email" id="suEmail" name="email" placeholder="Email" aria-label="Email" required>
      <span class="error-message" id="suEmailError"></span>

      <label for="suPassword" class="sr-only">Password</label>
      <div class="password-wrapper">
        <input type="password" id="suPassword" name="password" placeholder="Password" aria-label="Password" required minlength="8">
        <button type="button" class="toggle-password" data-target="suPassword" aria-label="Show password">
          <svg class="icon-eye" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
      <span class="error-message" id="suPasswordError"></span>

      <div class="mobile-actions" style="margin-top:16px;">
        <button type="submit" id="signUpSubmit">Sign up</button>
        <button type="button" class="ghost mobile-switch" data-switch="signin">Sign in</button>
      </div>
    </form>
  </div>

  <div class="form-container sign-in-container">
    <form id="signInForm" novalidate>
      <h1>Sign in to Website</h1>

      <div class="social-container mobile-social">
        <a href="#" aria-label="Facebook">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.51 1.49-3.9 3.77-3.9 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.91h-2.34V22c4.78-.79 8.44-4.94 8.44-9.94z"/></svg>
        </a>
        <a href="#" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.86 0-2.15 1.45-2.15 2.94v5.67H9.34V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>
        </a>
        <a href="#" aria-label="X">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M18.9 2H22l-7.6 8.7L23.3 22h-7.2l-5.6-7.3L4 22H1l8.1-9.3L1 2h7.4l5.1 6.7L18.9 2zm-1.3 18h1.9L7 4h-2l12.6 16z"/></svg>
        </a>
      </div>

      <label for="siEmail" class="sr-only">Email</label>
      <input type="email" id="siEmail" name="email" placeholder="Email" aria-label="Email" required>
      <span class="error-message" id="siEmailError"></span>

      <label for="siPassword" class="sr-only">Password</label>
      <div class="password-wrapper">
        <input type="password" id="siPassword" name="password" placeholder="Password" aria-label="Password" required>
        <button type="button" class="toggle-password" data-target="siPassword" aria-label="Show password">
          <svg class="icon-eye" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
      <span class="error-message" id="siPasswordError"></span>

      <div class="row-between">
        <label class="remember">
          <input type="checkbox" id="rememberMe">
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot">Forgot your password?</a>
      </div>

      <div class="mobile-actions">
        <button type="submit" id="signInSubmit">Sign in</button>
        <button type="button" class="ghost mobile-switch" data-switch="signup">Sign up</button>
      </div>
    </form>
  </div>

  <div class="overlay-container">
    <div class="overlay">
      <div class="overlay-panel overlay-left">
        <h2>Welcome back!</h2>
        <div class="social-container">
          <a href="#" aria-label="Facebook">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.51 1.49-3.9 3.77-3.9 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.91h-2.34V22c4.78-.79 8.44-4.94 8.44-9.94z"/></svg>
          </a>
          <a href="#" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.86 0-2.15 1.45-2.15 2.94v5.67H9.34V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>
          </a>
          <a href="#" aria-label="X">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M18.9 2H22l-7.6 8.7L23.3 22h-7.2l-5.6-7.3L4 22H1l8.1-9.3L1 2h7.4l5.1 6.7L18.9 2zm-1.3 18h1.9L7 4h-2l12.6 16z"/></svg>
          </a>
        </div>
        <p>Already have an account? Sign in to keep exploring with us.</p>
        <button class="ghost" id="signIn" data-switch="signin">Sign in</button>
      </div>
      <div class="overlay-panel overlay-right">
        <h2>Hello, friend!</h2>
        <div class="social-container">
          <a href="#" aria-label="Facebook">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.51 1.49-3.9 3.77-3.9 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.91h-2.34V22c4.78-.79 8.44-4.94 8.44-9.94z"/></svg>
          </a>
          <a href="#" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.86 0-2.15 1.45-2.15 2.94v5.67H9.34V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>
          </a>
          <a href="#" aria-label="X">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M18.9 2H22l-7.6 8.7L23.3 22h-7.2l-5.6-7.3L4 22H1l8.1-9.3L1 2h7.4l5.1 6.7L18.9 2zm-1.3 18h1.9L7 4h-2l12.6 16z"/></svg>
          </a>
        </div>
        <p>Enter your personal details and start your journey with us.</p>
        <button class="ghost" id="signUp" data-switch="signup">Sign up</button>
      </div>
    </div>
  </div>

</div>

<div id="toast" class="toast"></div>

<script src="js/script.js"></script>
<script src="js/validation.js"></script>
<script src="js/ux.js"></script>
</body>
</html>
